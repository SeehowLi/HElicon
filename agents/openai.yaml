interface:
  display_name: "HElicon"
  short_description: "FHE/security-paper mentor for new papers, whole-draft revision, and local polish."
  default_prompt: "$HElicon\nI may be starting from zero or revising an existing full draft. Route me directly: use H-NEW for a new paper, H-INTAKE for an existing draft, or the least-destructive no-command edit when I paste text."
policy:
  allow_implicit_invocation: true
